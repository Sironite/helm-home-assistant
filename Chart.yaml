apiVersion: v2
name: home-assistant
description: Home Assistant on Kubernetes with optional code-server addon and
  Authentik outpost
type: application
version: 3.1.0
appVersion: "2026.8.0"
keywords:
  - home-assistant
  - smart-home
  - iot
  - automation
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/home-assistant.png
home: https://www.home-assistant.io
sources:
  - https://github.com/home-assistant/core
  - https://github.com/sironite/helm-home-assistant
maintainers:
  - name: sironite
    url: https://github.com/sironite
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Home Assistant
      url: https://www.home-assistant.io
    - name: Source
      url: https://github.com/sironite/helm-home-assistant
  artifacthub.io/changes: |
    - kind: changed
      description: Update homeassistant to v2026.8.0
    - kind: fixed
      description: Mount coder-only secrets straight to destination, skip config staging
    - kind: fixed
      description: CI now syncs Chart.yaml version to the release version before packaging, preventing tag/version drift
